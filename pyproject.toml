[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "qqperf"
dynamic = ["version"]
description = "Performance records for quirq infra (qq): raw numbers with units, per commit."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest==9.1.1"]
# What the build-size workflow builds with: recipes' node-app adapter (V0-REC-03, quirq-ai/recipes#4),
# by pinned commit. TODO(expert): let rollers move this pin.
build = ["qqrecipes @ git+https://github.com/quirq-ai/recipes@c3b0cafa72da512e14eae90f5d0bac49692b835b"]

[project.scripts]
qqperf = "qqperf.cli:main"

[tool.setuptools.dynamic]
version = { attr = "qqperf.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
