# Perf records on every commit that lands on the product repos' main branches.
#
#   build-size             V0-PRF-02  size of innernet's Next.js build output
#   xo-space-server-start  V0-PRF-01  seconds until xo-space's server answers, over several starts
#   innernet-search        V0-PRF-01  latency of search requests on innernet's demo build
#
# Each measurement polls its repo's main and takes the newest commit that has no record yet, so a
# backlog drains one commit per run (about 48 a day). A new metric starts at main's newest commit and
# backfills nothing; every commit after its oldest record is owed one.
# Builds and benchmarks go through recipes' adapters (`build`, `bench`).
#
# Trust: `measure` runs product code and its dependencies, so it holds read access only and its
# output is a claim, not a record. It uploads only a ledger of records. `store`, which runs no
# product code, accepts a ledger only for its own leg's repo and metric, only for commits that are
# still pending and only for records naming this run, and pushes them to this repo's `perf-data`
# branch. The results bundles for test-pipelines' store are built from perf-data afterwards by
# perf-publish.yml, a separate workflow no job here can upload into.
# TODO(expert): run inside each product repo's generated post-submit (V0-GAR-01) instead of
# polling; read repos and benchmark params from infra-config (repos.toml, perf.toml) via qqcfg.
# GitHub turns off scheduled workflows after 60 days without repo activity; re-enable it then.
name: perf
on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:
concurrency:
  group: perf-data  # one writer of the history at a time
  cancel-in-progress: false
permissions:
  contents: read
env:
  DATA_BRANCH: perf-data
  RUNNER_LABEL: ubuntu-24.04
jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - metric: build-size
            repo: innernet
            node: true
          - metric: xo-space-server-start
            repo: xo-space
            target: server
            params: '{"bench": {"measure": "startup", "samples": 5, "warmup": 1}}'
          - metric: innernet-search
            repo: innernet
            target: app
            node: true
            # The demo build serves the committed demo index, so every commit searches the same data.
            params: >-
              {"env": {"INNERNET_DEMO": "1"}, "bench": {"measure": "latency", "samples": 10, "warmup": 2,
              "paths": ["/search?q=build", "/search?q=quirq", "/search?q=readme"]}}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # CPython 3.14.8, as the manifests pin, for qqperf and for xo-space itself.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        id: python
        with:
          python-version: "3.14.8"
      - run: python -m pip install --quiet -e ".[build]"
      - name: history so far
        shell: bash  # -eo pipefail, so a failed git archive cannot pass as an empty history
        run: |
          mkdir -p .qq/data
          # Exit code 2 means no such branch yet; any other failure stops the run.
          rc=0; git ls-remote --exit-code --heads origin "$DATA_BRANCH" >/dev/null || rc=$?
          if [ "$rc" = 0 ]; then
            git fetch --quiet --depth 1 origin "$DATA_BRANCH"
            git archive FETCH_HEAD | tar -x -C .qq/data
          elif [ "$rc" != 2 ]; then
            exit "$rc"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: quirq-ai/${{ matrix.repo }}
          ref: main
          # All of main's history, without file contents until a commit is checked out: perf owes a
          # record to every commit since its oldest record, however far back that now is.
          fetch-depth: 0
          filter: blob:none
          path: .qq/product
          persist-credentials: false
      # The manifests until V0-ONB-01/02 land infra/repo.toml, from the sync commit recipes uses.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: quirq-ai/sync
          ref: 8f624f4a7fe3abdab2c7b83376f1ae7772073fd4
          path: .qq/sync
          persist-credentials: false
      # Node and pnpm at the toolchains pins, as recipes' CI does, until V0-TCH-02 is used.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        if: matrix.node
        with:
          node-version: "24.21.0"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86  # v6.0.10
        if: matrix.node
        with:
          version: "11.28.2"
      - name: the newest commit with no record
        id: pending
        env:
          REPO: ${{ matrix.repo }}
          METRIC: ${{ matrix.metric }}
        run: |
          commit=$(qqperf pending --store .qq/data --repo "$REPO" --metric "$METRIC" --checkout .qq/product --limit 1)
          echo "pending: ${commit:-none}"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      # Make the backlog visible: one commit is measured per run, newest first, so commits wait when
      # main lands faster than runs measure. Only a report, so it never stops the measurement.
      # Counted before this run's measurement.
      - name: the backlog
        continue-on-error: true
        env:
          REPO: ${{ matrix.repo }}
          METRIC: ${{ matrix.metric }}
        run: |
          backlog=$(qqperf backlog --store .qq/data --repo "$REPO" --metric "$METRIC" --checkout .qq/product)
          echo "backlog: $backlog"
          echo "$REPO $METRIC backlog: \`$backlog\`" >> "$GITHUB_STEP_SUMMARY"
          falling_out=$(jq -r .falling_out <<<"$backlog")
          pending=$(jq -r .pending <<<"$backlog")
          oldest=$(jq -r .oldest_pending <<<"$backlog")
          # More than a day of runs behind: the oldest owed commits wait while newer ones go first.
          if [ "$pending" -gt 48 ]; then
            echo "::warning::$REPO $METRIC: $pending commits on main are still to be measured (oldest $oldest); perf is more than a day behind"
          fi
          # Only for a shallow checkout (this job's is full): owed commits beyond it are not seen.
          if [ "$falling_out" = true ] && [ "$pending" -gt 1 ]; then
            echo "::warning::$REPO $METRIC: the checkout is shallow and owed commits older than it are not measured"
          fi
      - name: measure it
        id: measure
        if: steps.pending.outputs.commit != ''
        timeout-minutes: 35  # below the job's, so the uploads below still keep what was recorded
        env:
          REPO: ${{ matrix.repo }}
          METRIC: ${{ matrix.metric }}
          TARGET: ${{ matrix.target }}
          PARAMS: ${{ matrix.params }}
          COMMIT: ${{ steps.pending.outputs.commit }}
          PYTHON_ROOT: ${{ steps.python.outputs.python-path }}
        run: |
          fixture=.qq/sync/tests/fixtures/$REPO.repo.toml
          if [ "$METRIC" = build-size ]; then
            tools/build_commits.sh .qq/product "$fixture" .qq/new "$REPO" "$RUNNER_LABEL" "$COMMIT"
          elif [ "$REPO" = xo-space ]; then
            QQ_RECIPES_ARGS="--toolchain python=$(dirname "$(dirname "$PYTHON_ROOT")")" \
            QQ_TOOLCHAINS="python=$(python -c 'import platform; print(platform.python_version())')" \
              tools/bench_commit.sh .qq/product "$fixture" "$TARGET" "$PARAMS" .qq/new "$REPO" "$METRIC" \
                "$RUNNER_LABEL" "$COMMIT"
          else
            QQ_TOOLCHAINS="node=$(node --version | sed 's/^v//') pnpm=$(pnpm --version)" \
              tools/bench_commit.sh .qq/product "$fixture" "$TARGET" "$PARAMS" .qq/new "$REPO" "$METRIC" \
                "$RUNNER_LABEL" "$COMMIT"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: failure() && steps.pending.outputs.commit != ''
        with:
          # The service and step logs of a failed build or benchmark, which the record only points at.
          name: logs--${{ matrix.repo }}--${{ matrix.metric }}
          path: |
            ${{ runner.temp }}/qq-out/*/logs/
            ${{ runner.temp }}/qq-bench/out-*/logs/
          if-no-files-found: ignore
          overwrite: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always() && steps.pending.outputs.commit != ''
        with:
          # ledger--<repo>--<metric>: the store job takes one record from each, for that repo and
          # metric only.
          name: ledger--${{ matrix.repo }}--${{ matrix.metric }}
          path: .qq/new/
          if-no-files-found: ignore
          overwrite: true  # a re-run of this job replaces the attempt before it
  store:
    needs: measure
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # No stored credentials: only the final push step gets the token, not qqperf or the
      # product clones, which all run before it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # Nothing is fetched or installed: qqperf runs from this checkout (tools/qqperf) on the
      # runner's own python3, so no build backend, package index or Python download runs in the job
      # that holds write access.
      - run: echo "$GITHUB_WORKSPACE/tools" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7.0.0
        continue-on-error: true  # none when no job had a commit to measure
        with:
          pattern: ledger--*
          path: .qq/new
      - name: append to the history branch
        id: store
        shell: bash  # -eo pipefail
        run: |
          if [ -z "$(find .qq/new -name '*.jsonl' 2>/dev/null)" ]; then
            echo "no records to store"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rc=0; git ls-remote --exit-code --heads origin "$DATA_BRANCH" >/dev/null || rc=$?
          if [ "$rc" = 0 ]; then
            git fetch --quiet --depth 1 origin "$DATA_BRANCH"
            git worktree add --quiet .qq/data FETCH_HEAD
            git -C .qq/data checkout --quiet -B "$DATA_BRANCH"
          elif [ "$rc" != 2 ]; then
            exit "$rc"
          else
            git worktree add --quiet --orphan -b "$DATA_BRANCH" .qq/data
            printf '%s\n' "# perf-data" "" \
              "Perf history written by this repo's workflows (schema qq-perf-record/1), one JSON" \
              "Lines file per repo and metric. Write-once: never edit a line." > .qq/data/README.md
          fi
          # Each ledger came from a job that ran one repo's code. Take at most one record from it:
          # for that leg's repo and metric, for one of the newest three commits still pending on
          # the repo's main (the leg took the newest; main may have moved since), naming this run
          # (any attempt; one an earlier attempt already stored is skipped). A refused ledger only
          # delays its commit to a later run. Artifact names are not bound to the job that uploads them,
          # so a compromised leg can still claim one commit of another leg per run.
          # TODO(expert): isolate each repo's measurement in its own workflow run.
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/"
          refused=0
          for dir in .qq/new/ledger--*; do
            name=${dir##*/ledger--}
            repo=${name%%--*} metric=${name#*--}
            case "$repo/$metric" in
              innernet/build-size|innernet/innernet-search|xo-space/xo-space-server-start) ;;
              *) echo "::error::unexpected ledger $name"; refused=1; continue ;;
            esac
            if [ ! -d ".qq/repos/$repo" ] && ! git clone --quiet --filter=tree:0 --single-branch --no-checkout \
                "https://github.com/quirq-ai/$repo" ".qq/repos/$repo"; then
              echo "::error::cannot clone $repo; ledger $name not stored"; refused=1; continue
            fi
            if ! newest=$(qqperf pending --store .qq/data --repo "$repo" --metric "$metric" \
                            --checkout ".qq/repos/$repo" --limit 3); then
              echo "::error::cannot list pending commits of $repo; ledger $name not stored"; refused=1; continue
            fi
            allowed=()
            for c in $newest; do allowed+=(--commit "$c"); done
            if [ ${#allowed[@]} = 0 ] || ! qqperf merge --store .qq/data --from "$dir" --repo "$repo" \
                --metric "$metric" --run-url-prefix "$run_url" "${allowed[@]}" --max-records 1; then
              echo "::error::ledger $name refused"; refused=1
            fi
          done
          echo "refused=$refused" >> "$GITHUB_OUTPUT"
          if [ -z "$(git -C .qq/data status --porcelain)" ]; then
            echo "nothing new to store"; exit 0
          fi
          git -C .qq/data add -A
          git -C .qq/data commit --quiet -m "perf: records from run ${GITHUB_RUN_ID}"
          echo "push=1" >> "$GITHUB_OUTPUT"
      - name: push the history branch
        if: steps.store.outputs.push == '1'
        shell: bash
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: |
          auth=$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          # Through the environment, so the header never appears in a process's arguments.
          # No hooks: nothing an earlier step left in .git/hooks runs with the token.
          GIT_CONFIG_COUNT=2 GIT_CONFIG_KEY_0=http.extraheader \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth" \
            GIT_CONFIG_KEY_1=core.hooksPath GIT_CONFIG_VALUE_1=/dev/null \
            git -C .qq/data push --quiet origin "HEAD:$DATA_BRANCH"
      - name: fail on refused ledgers
        if: steps.store.outputs.refused == '1'
        run: |
          echo "::error::at least one ledger was refused; see the step above"
          exit 1
