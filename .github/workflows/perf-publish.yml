# Publish the records a perf run stored as test-pipelines results bundles (V0-PRF-01).
#
# The only source of perf's `qq-results-*` artifacts. It runs after perf.yml completes on main,
# from the default branch's copy of this file, and runs no product code: it reads the records the
# perf run's `store` job validated and pushed to `perf-data` (those naming that run) and writes
# each as a bundle. It downloads nothing from the perf run: what it publishes comes from perf-data
# alone. test-pipelines' scorecard is to collect perf bundles only from runs of this workflow
# (event workflow_run, branch main), since a job that runs product code can upload artifacts into
# its own run whatever this repo's workflows say. Re-running this workflow writes the same
# records again under a new run id; v0 accepts that (kind "other" counts toward no rate).
name: perf-publish
on:
  workflow_run:
    workflows: [perf]
    types: [completed]
    branches: [main]
permissions:
  contents: read
env:
  DATA_BRANCH: perf-data
jobs:
  publish:
    # Only a run of perf.yml on this repo's main, from its schedule or a dispatch: workflow_run also
    # fires for runs on other branches or from other repos' pull requests, if perf.yml ever gets one.
    # head_branch is a ref's short name, so a tag named main passes it: the first step refuses to
    # publish while such a tag exists and checks that the commit is on the main branch. What
    # perf-data holds is trusted as written: anyone who can push to it, or a run of an old perf.yml
    # through a main tag, can publish, so perf-data and main tags need rulesets (admin, S13).
    if: >-
      github.event.workflow_run.head_branch == 'main'
      && github.event.workflow_run.head_repository.full_name == github.repository
      && github.event.workflow_run.path == '.github/workflows/perf.yml'
      && contains(fromJSON('["schedule", "workflow_dispatch"]'), github.event.workflow_run.event)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # The measurements of perf.yml's matrix.
        include:
          - {repo: innernet, metric: build-size}
          - {repo: xo-space, metric: xo-space-server-start}
          - {repo: innernet, metric: innernet-search}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # Before anything else runs: no main tag, and the perf run's commit is on the main branch.
      - name: the perf run's commit is on main
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          rc=0; git ls-remote --exit-code origin refs/tags/main >/dev/null || rc=$?
          if [ "$rc" != 2 ]; then
            echo "::error::a tag named main exists, or ls-remote failed (exit $rc); not publishing"; exit 1
          fi
          if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
            git fetch --quiet --unshallow origin refs/heads/main
          else
            git fetch --quiet origin refs/heads/main
          fi
          git merge-base --is-ancestor "$HEAD_SHA" FETCH_HEAD ||
            { echo "::error::$HEAD_SHA is not on main; not publishing"; exit 1; }
      # Nothing is installed: qqperf runs from this checkout and qqresults from its pinned
      # source, on the runner's own python3, so no build backend, package index or Python download
      # runs in the job whose artifacts test-pipelines trusts.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: quirq-ai/test-pipelines
          ref: 3aeed94f733a99cac22f29a47578cd8ff88bf3ae  # pyproject.toml's qqresults pin
          path: .qq/test-pipelines
          persist-credentials: false
      - run: |
          echo "$GITHUB_WORKSPACE/tools" >> "$GITHUB_PATH"
          echo "PYTHONPATH=$GITHUB_WORKSPACE/.qq/test-pipelines/src" >> "$GITHUB_ENV"
      - name: the records stored so far
        shell: bash
        run: |
          mkdir -p .qq/data
          rc=0; git ls-remote --exit-code --heads origin "$DATA_BRANCH" >/dev/null || rc=$?
          if [ "$rc" = 0 ]; then
            git fetch --quiet --depth 1 origin "$DATA_BRANCH"
            git archive FETCH_HEAD | tar -x -C .qq/data
          elif [ "$rc" != 2 ]; then
            exit "$rc"
          fi
      - name: write the perf run's record as a results bundle
        id: bundle
        env:
          REPO: ${{ matrix.repo }}
          METRIC: ${{ matrix.metric }}
          PERF_RUN_ID: ${{ github.event.workflow_run.id }}
          PERF_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          qqperf bundle --store .qq/data --repo "$REPO" --metric "$METRIC" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$PERF_RUN_ID/attempts/$PERF_RUN_ATTEMPT" \
            --results-out .qq/results --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: steps.bundle.outputs.name != ''
        with:
          name: ${{ steps.bundle.outputs.name }}
          path: ${{ steps.bundle.outputs.bundle }}
          if-no-files-found: error
