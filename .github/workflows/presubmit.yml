# Required check for this repo. Hand-written until infra-config generates builders for infra repos.
# Runs on every PR and in the merge queue, so it verifies the exact merge result.
name: presubmit
on:
  pull_request:
  merge_group:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  presubmit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # The CPython quirq infra pins (3.14.8), until the toolchain quirq-ai/toolchains publishes is used.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14.8"
      - run: python -m pip install --quiet -e ".[test]"
      - run: python -m pytest -q -p no:cacheprovider
  # End to end, with the same scripts the perf workflow runs, at pinned product commits, into
  # scratch stores: V0-PRF-02's build size of innernet, and V0-PRF-01's benchmark of each product
  # repo. Each record is also written as a results bundle and read back with qqresults; presubmit
  # keeps no bundle artifact (only perf-publish.yml does), so these numbers never reach the store.
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - metric: build-size
            repo: innernet
            commit: da9b84cf811f4358e3ee0b5d9d4388b69bf481e9
            node: true
          - metric: xo-space-server-start
            repo: xo-space
            commit: c3cea98c8e70479b1f0cb8f871e28f8f6ee5a4f6
            target: server
            params: '{"bench": {"measure": "startup", "samples": 5, "warmup": 1}}'
          - metric: innernet-search
            repo: innernet
            commit: da9b84cf811f4358e3ee0b5d9d4388b69bf481e9
            target: app
            node: true
            params: >-
              {"env": {"INNERNET_DEMO": "1"}, "bench": {"measure": "latency", "samples": 10, "warmup": 2,
              "paths": ["/search?q=build", "/search?q=quirq", "/search?q=readme"]}}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        id: python
        with:
          python-version: "3.14.8"
      - run: python -m pip install --quiet -e ".[build]"
      - uses: actions/checkout@v7
        with:
          repository: quirq-ai/${{ matrix.repo }}
          ref: ${{ matrix.commit }}  # TODO(expert): let rollers move these pins.
          path: .qq/product
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: quirq-ai/sync
          ref: 8f624f4a7fe3abdab2c7b83376f1ae7772073fd4
          path: .qq/sync
          persist-credentials: false
      - uses: actions/setup-node@v7
        if: matrix.node
        with:
          node-version: "24.21.0"
      - uses: pnpm/action-setup@v6
        if: matrix.node
        with:
          version: "11.28.2"
      - name: measure and record
        env:
          REPO: ${{ matrix.repo }}
          METRIC: ${{ matrix.metric }}
          TARGET: ${{ matrix.target }}
          PARAMS: ${{ matrix.params }}
          COMMIT: ${{ matrix.commit }}
          PYTHON_ROOT: ${{ steps.python.outputs.python-path }}
        run: |
          fixture=.qq/sync/tests/fixtures/$REPO.repo.toml
          if [ "$METRIC" = build-size ]; then
            tools/build_commits.sh .qq/product "$fixture" .qq/new "$REPO" ubuntu-24.04 "$COMMIT"
          elif [ "$REPO" = xo-space ]; then
            QQ_RECIPES_ARGS="--toolchain python=$(dirname "$(dirname "$PYTHON_ROOT")")" \
              tools/bench_commit.sh .qq/product "$fixture" "$TARGET" "$PARAMS" .qq/new "$REPO" "$METRIC" \
                ubuntu-24.04 "$COMMIT"
          else
            tools/bench_commit.sh .qq/product "$fixture" "$TARGET" "$PARAMS" .qq/new "$REPO" "$METRIC" \
              ubuntu-24.04 "$COMMIT"
          fi
          qqperf history --store .qq/new --repo "$REPO" --metric "$METRIC" --json
          # A failure is recorded too; here the measurement must have succeeded.
          test "$(qqperf history --store .qq/new --repo "$REPO" --metric "$METRIC" --json \
            | python -c 'import json, sys; print(json.load(sys.stdin)[0]["status"])')" = ok
          qqperf bundle --store .qq/new --repo "$REPO" --metric "$METRIC" --results-backend local \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --results-out .qq/results
          for b in .qq/results/qq-results-*; do qqresults show "$b"; cat "$b/results.jsonl"; done
  # One stable name for the required checks: matrix legs report under per-leg names.
  measure-result:
    needs: measure
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: every measure leg passed
        env:
          RESULT: ${{ needs.measure.result }}
        run: |
          echo "measure: $RESULT"
          [ "$RESULT" = success ]
